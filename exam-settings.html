<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>הגדרות מבחן אמריקאי</title>

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/exam-settings.css" />
  </head>

  <body>
    <!-- סרגל עליון -->
    <div class="top-bar">
      <button class="nav-btn" id="prev-page">⟵ לעמוד הקודם</button>
      <div class="title-wrap">
        <p class="subject-label">הנושא הנבחר</p>
        <h1 class="page-title" id="pageTitle">—</h1>
      </div>
      <button class="nav-btn" id="home-page">לעמוד הבית ⟶</button>
    </div>

    <!-- כרטיס הגדרות -->
    <div class="settings-card">
      <h2 class="settings-title">הגדרות המבחן</h2>

      <!-- תת נושא -->
      <div class="form-row">
        <label>בחר תת-נושא</label>
        <select id="subtopicSelect">
          <option value="all">כל התתי-נושאים</option>
        </select>
      </div>

      <!-- סוג שאלות -->
      <div class="form-row">
        <label>סוג השאלות</label>
        <select id="typeSelect">
          <option value="all">כל השאלות</option>
          <option value="easy">שאלות קלות</option>
          <option value="hard">שאלות מאתגרות</option>
        </select>
      </div>

      <!-- זמן לשאלה -->
      <div class="form-row">
        <label>זמן לכל שאלה</label>
        <button class="mini-btn" id="time-btn">
          <span id="time-value">30 שניות</span>
        </button>
      </div>

      <!-- מספר שאלות -->
      <div class="form-row">
        <label>מספר שאלות</label>
        <button class="mini-btn" id="questions-btn">
          <span id="questions-value">20 שאלות</span>
        </button>
      </div>

      <!-- פסילות -->
      <div class="form-row">
        <label>מספר פסילות</label>
        <button class="mini-btn" id="fails-btn">
          <span id="fails-value">עד 5 פסילות</span>
        </button>
      </div>

      <!-- כפתור התחל -->
      <button id="start-btn" class="start-btn">התחל מבחן</button>
    </div>

    <!-- חלון קלט -->
    <div class="modal" id="modal">
      <div class="modal-content">
        <h3 id="modal-title"></h3>
        <input type="number" id="modal-input" />
        <div class="modal-actions">
          <button id="save-btn" class="primary">שמור</button>
          <button id="cancel-btn">בטל</button>
        </div>
      </div>
    </div>

    <script src="data/exam-bank.js"></script>
    <script src="js/exam-settings.js"></script>

    <script>
      // כותרת הנושא מתוך ה-URL
      const SUBJECT_TITLES = {
        anatomy: "אנטומיה",
        chemistry: "כימיה",
        psychology: "פסיכולוגיה",
        literacy: "אוריינות שפתית",
        basketball: "יסודות בכדורסל",
        athletics: "יסודות באתלטיקה",
        football: "יסודות בכדורגל",
        physics: "פיזיקה",
        statistics1: "סטטיסטיקה – חלק א׳",
      };

      window.addEventListener("load", () => {
        const params = new URLSearchParams(window.location.search);
        const subject = params.get("subject");
        document.getElementById("pageTitle").textContent =
          SUBJECT_TITLES[subject] || "נושא לא מוגדר";

        // טעינת תתי נושאים
        const select = document.getElementById("subtopicSelect");
        select.innerHTML = `<option value="all">כל התתי-נושאים</option>`;

        if (window.examBank) {
          const subtopics = [...new Set(examBank.map((q) => q.subtopic))];
          subtopics.forEach((st) => {
            const opt = document.createElement("option");
            opt.value = st;
            opt.textContent = st;
            select.appendChild(opt);
          });
        }
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <title>בחר שיטת תרגול</title>

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/method.css?v=3" />

    <style>
      body {
        opacity: 0;
        transition: opacity 0.4s ease;
      }

      body.fade-in {
        opacity: 1;
      }

      body.fade-out {
        opacity: 0;
      }
    </style>
  </head>

  <body>
    <main class="wrap method-wrap">
      <div class="glow glow-a"></div>
      <div class="glow glow-b"></div>

      <button class="back-btn" type="button" aria-label="לעמוד הקודם">
        <span class="back-icon" aria-hidden="true">◀</span>
        <span>לעמוד הקודם</span>
      </button>

      <header class="hero method-hero">
        <div class="method-emoji" aria-hidden="true">🗣️</div>

        <h1>בחר שיטת תרגול</h1>

        <p class="chosen-subject" id="chosenSubject"></p>
      </header>

      <section class="method-grid" aria-label="שיטות תרגול">
        <button class="method-card" id="quizBtn" type="button">
          <span class="method-card__icon" aria-hidden="true">📝</span>

          <span class="method-card__content">
            <span class="method-card__title">מבחן אמריקאי</span>

            <span class="method-card__description">
              שאלות עם ארבע אפשרויות ותשובה נכונה אחת
            </span>
          </span>
        </button>

        <button class="method-card" id="showBtn" type="button">
          <span class="method-card__icon" aria-hidden="true">📚</span>

          <span class="method-card__content">
            <span class="method-card__title">שאלות ותשובות</span>

            <span class="method-card__description">
              מעבר על שאלות עם הסברים ותשובות מלאות
            </span>
          </span>
        </button>
      </section>
    </main>

    <script src="js/method.js"></script>
  </body>
</html>

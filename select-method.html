<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <title>בחר שיטת תרגול</title>

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/method.css?v=6" />
  </head>

  <body>
    <main class="wrap method-wrap">
      <div class="glow glow-a" aria-hidden="true"></div>
      <div class="glow glow-b" aria-hidden="true"></div>

      <button class="back-btn" type="button" aria-label="לעמוד הקודם">
        <span class="back-icon" aria-hidden="true">◀</span>
        <span>לעמוד הקודם</span>
      </button>

      <!-- לוגו עליון -->
      <header class="page-brand" aria-label="מיתוג האתר">
        <h1 class="brand-title">Smart Study</h1>
        <p class="brand-subtitle">למידה אינטראקטיבית</p>
      </header>

      <!-- פרטי הנושא שנבחר -->
      <section class="subject-intro" aria-labelledby="subjectTitle">
        <div class="subject-intro__image-wrap">
          <img id="subjectImage" class="subject-intro__image" src="" alt="" />

          <span class="subject-intro__shine" aria-hidden="true"></span>
        </div>

        <div class="subject-intro__content">
          <p class="subject-intro__eyebrow">הנושא שנבחר</p>

          <h2 id="subjectTitle" class="subject-intro__title">נושא לא מוגדר</h2>

          <p id="subjectDescription" class="subject-intro__description">
            טוען את פרטי הנושא...
          </p>
        </div>
      </section>

      <!-- בחירת שיטת תרגול -->
      <section class="method-section" aria-labelledby="methodSectionTitle">
        <header class="method-hero">
          <div class="method-emoji" aria-hidden="true">🧠</div>

          <h2 id="methodSectionTitle">בחר שיטת תרגול</h2>

          <p class="chosen-subject" id="chosenSubject"></p>
        </header>

        <div class="method-grid" aria-label="שיטות תרגול">
          <!-- מבחן אמריקאי -->
          <button class="method-card" id="quizBtn" type="button">
            <span class="method-card__icon" aria-hidden="true">📝</span>

            <span class="method-card__content">
              <span class="method-card__title">מבחן אמריקאי</span>

              <span class="method-card__description">
                שאלות עם ארבע אפשרויות ותשובה נכונה אחת
              </span>
            </span>
          </button>

          <!-- שאלות ותשובות -->
          <button class="method-card" id="showBtn" type="button">
            <span class="method-card__icon" aria-hidden="true">📚</span>

            <span class="method-card__content">
              <span class="method-card__title">שאלות ותשובות</span>

              <span class="method-card__description">
                מעבר על שאלות עם הסברים ותשובות מלאות
              </span>
            </span>
          </button>

          <!-- למידה ויזואלית -->
          <button class="method-card" id="visualBtn" type="button">
            <span class="method-card__icon" aria-hidden="true">👁️</span>

            <span class="method-card__content">
              <span class="method-card__title">למידה ויזואלית</span>

              <span class="method-card__description">
                למידה באמצעות תמונות, תרשימים והמחשות חזותיות
              </span>
            </span>
          </button>
        </div>
      </section>
    </main>

    <script src="js/method.js"></script>
  </body>
</html>

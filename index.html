<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <title>Smart Study</title>

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/index.css" />
  </head>

  <body>
    <main class="wrap">
      <!-- רקעי זוהר דקורטיביים -->
      <div class="glow glow-a" aria-hidden="true"></div>
      <div class="glow glow-b" aria-hidden="true"></div>

      <!-- כותרת ראשית -->
      <header class="hero">
        <h1 class="brand-title">Smart Study</h1>

        <p class="brand-subtitle">למידה אינטראקטיבית</p>

        <h2 class="choose-title">בחר נושא</h2>
      </header>

      <!-- כרטיסי הנושאים -->
      <!-- כרטיסי הנושאים -->
      <section class="subject-grid" aria-label="רשימת נושאים">
        <!-- היסטוריה של הספורט -->
        <button
          class="subject-card"
          data-key="sportHistory"
          type="button"
          style="background-image: url(&quot;./imgs/sport-history.jpg&quot;)"
        >
          <span class="subject-card__overlay"></span>
          <span class="subject-card__title">היסטוריה של הספורט</span>
        </button>

        <!-- פסיכולוגיה התפתחותית -->
        <button
          class="subject-card"
          data-key="developmentalPsychology"
          type="button"
          style="
            background-image: url(&quot;./imgs/developmental-psychology.jpg&quot;);
          "
        >
          <span class="subject-card__overlay"></span>
          <span class="subject-card__title">פסיכולוגיה התפתחותית</span>
        </button>

        <!-- מחשבת החינוך -->
        <button
          class="subject-card"
          data-key="educationalThought"
          type="button"
          style="
            background-image: url(&quot;./imgs/educational-thought.jpg&quot;);
          "
        >
          <span class="subject-card__overlay"></span>
          <span class="subject-card__title">מחשבת החינוך</span>
        </button>

        <!-- אוריינות שפתית -->
        <button
          class="subject-card"
          data-key="literacy"
          type="button"
          style="background-image: url(&quot;./imgs/literacy.png&quot;)"
        >
          <span class="subject-card__overlay"></span>
          <span class="subject-card__title">אוריינות שפתית</span>
        </button>

        <!-- אנטומיה -->
        <button
          class="subject-card"
          data-key="anatomy"
          type="button"
          style="background-image: url(&quot;./imgs/anatomy.png&quot;)"
        >
          <span class="subject-card__overlay"></span>
          <span class="subject-card__title">אנטומיה</span>
        </button>

        <!-- כימיה -->
        <button
          class="subject-card"
          data-key="chemistry"
          type="button"
          style="background-image: url(&quot;./imgs/chemistry.png&quot;)"
        >
          <span class="subject-card__overlay"></span>
          <span class="subject-card__title">כימיה</span>
        </button>

        <!-- פסיכולוגיה -->
        <button
          class="subject-card"
          data-key="psychology"
          type="button"
          style="background-image: url(&quot;./imgs/psychology.png&quot;)"
        >
          <span class="subject-card__overlay"></span>
          <span class="subject-card__title">פסיכולוגיה</span>
        </button>

        <!-- כדורסל -->
        <button
          class="subject-card"
          data-key="basketball"
          type="button"
          style="background-image: url(&quot;./imgs/basketball.png&quot;)"
        >
          <span class="subject-card__overlay"></span>
          <span class="subject-card__title">כדורסל</span>
        </button>

        <!-- אתלטיקה -->
        <button
          class="subject-card"
          data-key="athletics"
          type="button"
          style="background-image: url(&quot;./imgs/athletics.png&quot;)"
        >
          <span class="subject-card__overlay"></span>
          <span class="subject-card__title">אתלטיקה</span>
        </button>

        <!-- כדורגל -->
        <button
          class="subject-card"
          data-key="football"
          type="button"
          style="background-image: url(&quot;./imgs/football.png&quot;)"
        >
          <span class="subject-card__overlay"></span>
          <span class="subject-card__title">כדורגל</span>
        </button>

        <!-- סטטיסטיקה א׳ -->
        <button
          class="subject-card"
          data-key="statistics1"
          type="button"
          style="background-image: url(&quot;./imgs/statistics-1.png&quot;)"
        >
          <span class="subject-card__overlay"></span>
          <span class="subject-card__title">סטטיסטיקה א׳</span>
        </button>

        <!-- סטטיקה ודינמיקה -->
        <button
          class="subject-card"
          data-key="statsDynamics"
          type="button"
          style="background-image: url(&quot;./imgs/statics-dynamics.png&quot;)"
        >
          <span class="subject-card__overlay"></span>
          <span class="subject-card__title">סטטיקה ודינמיקה</span>
        </button>

        <!-- ניהול כיתה -->
        <button
          class="subject-card"
          data-key="Biochemistry"
          type="button"
          style="background-image: url(&quot;./imgs/biochemistry.png&quot;)"
        >
          <span class="subject-card__overlay"></span>
          <span class="subject-card__title">ביוכימיה</span>
        </button>

        <!-- כדורעף -->
        <button
          class="subject-card"
          data-key="volleyball"
          type="button"
          style="background-image: url(&quot;./imgs/volleyball.png&quot;)"
        >
          <span class="subject-card__overlay"></span>
          <span class="subject-card__title">כדורעף</span>
        </button>

        <!-- כדוריד -->
        <button
          class="subject-card"
          data-key="handball"
          type="button"
          style="background-image: url(&quot;./imgs/handball.png&quot;)"
        >
          <span class="subject-card__overlay"></span>
          <span class="subject-card__title">כדוריד</span>
        </button>
      </section>
    </main>

    <script src="js/index.js"></script>
  </body>
</html>

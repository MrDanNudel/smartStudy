<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <title>Smart Study</title>

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/index.css" />
  </head>

  <body>
    <main class="wrap">
      <!-- רקעי זוהר דקורטיביים -->
      <div class="glow glow-a" aria-hidden="true"></div>
      <div class="glow glow-b" aria-hidden="true"></div>

      <!-- כותרת ראשית -->
      <header class="hero">
        <h1 class="brand-title">Smart Study</h1>

        <p class="brand-subtitle">למידה אינטראקטיבית</p>

        <h2 class="choose-title">בחר נושא</h2>
      </header>

      <!-- כרטיסי הנושאים -->
      <section class="subject-grid" aria-label="רשימת נושאים">
        <!-- היסטוריה של הספורט -->
        <button
          class="subject-card"
          data-key="sportHistory"
          type="button"
          style="background-image: url(&quot;./imgs/sport-history.jpg&quot;)"
        >
          <span class="subject-card__overlay"></span>
          <span class="subject-card__title">היסטוריה של הספורט</span>
        </button>

        <!-- פסיכולוגיה התפתחותית -->
        <button
          class="subject-card"
          data-key="developmentalPsychology"
          type="button"
          style="
            background-image: url(&quot;./imgs/developmental-psychology.jpg&quot;);
          "
        >
          <span class="subject-card__overlay"></span>
          <span class="subject-card__title">פסיכולוגיה התפתחותית</span>
        </button>

        <!-- מחשבת החינוך -->
        <button
          class="subject-card"
          data-key="educationalThought"
          type="button"
          style="
            background-image: url(&quot;./imgs/educational-thought.jpg&quot;);
          "
        >
          <span class="subject-card__overlay"></span>
          <span class="subject-card__title">מחשבת החינוך</span>
        </button>

        <!-- אוריינות שפתית -->
        <button
          class="subject-card"
          data-key="literacy"
          type="button"
          style="background-image: url(&quot;./imgs/literacy.png&quot;)"
        >
          <span class="subject-card__overlay"></span>
          <span class="subject-card__title">אוריינות שפתית</span>
        </button>
      </section>
    </main>

    <script src="js/index.js"></script>
  </body>
</html>
